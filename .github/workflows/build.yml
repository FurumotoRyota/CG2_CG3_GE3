name: Build

# push や プルリクエスト のたびに、Debug / Development / Release の3つをビルドして確認する
# Engine の更新（自動で作られるプルリクエスト）も、ここでビルドが通るか確認される
on:
  push:
  pull_request:

# 同じブランチで続けて push したときは、古いビルドをやめて新しいほうだけ動かす
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows Server 2025 with Visual Studio 2026 (the project uses toolset v145)
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Development, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Engine をサブモジュールにしたあとも、中身を取ってくる

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (${{ matrix.configuration }} | x64)
        run: msbuild CG2.2.slnx /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64
